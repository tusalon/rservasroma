<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
  <style>
@font-face { font-family: 'Barlow'; font-weight: 400; font-style: normal; src: url('capture/assets/fonts/Barlow-400.woff2') format('woff2'); }
@font-face { font-family: 'Barlow'; font-weight: 500; font-style: normal; src: url('capture/assets/fonts/Barlow-500.woff2') format('woff2'); }
@font-face { font-family: 'Barlow'; font-weight: 600; font-style: normal; src: url('capture/assets/fonts/Barlow-600.woff2') format('woff2'); }
@font-face { font-family: 'Barlow'; font-weight: 700; font-style: normal; src: url('capture/assets/fonts/Barlow-700.woff2') format('woff2'); }
@font-face { font-family: 'Barlow'; font-weight: 800; font-style: normal; src: url('capture/assets/fonts/Barlow-800.woff2') format('woff2'); }
@font-face { font-family: 'Barlow'; font-weight: 900; font-style: normal; src: url('capture/assets/fonts/Barlow-900.woff2') format('woff2'); }
    #root {
      position: absolute;
      inset: 0;
      color: #FFFFFF;
      font-family: Barlow, system-ui, sans-serif;
      container-type: size;
      overflow: hidden;
    }
    .aciegas-bg {
      position: absolute;
      inset: 0;
      background: #1A1A1A;
    }
    .aciegas-wrap {
      position: absolute;
      left: 5.5cqw;
      right: 5.5cqw;
      top: 42cqh;
    }
    .aciegas-headline {
      font-weight: 900;
      text-transform: lowercase;
      letter-spacing: -0.03em;
      line-height: 0.95;
      font-size: 10.5cqw;
    }
    .aciegas-accent {
      display: inline-block;
      color: #FF1493;
    }
    .aciegas-sticker {
      position: absolute;
      left: 50%;
      top: 68cqh;
      width: 30cqw;
      transform: translateX(-50%) scale(0.7);
      opacity: 0;
    }
  </style>
  <div id="root" data-composition-id="05-a-ciegas" data-start="0" data-duration="1.856" data-width="1080" data-height="1920">
    <div class="clip aciegas-bg" data-start="0" data-duration="1.856" data-track-index="0"></div>
    <div class="aciegas-wrap">
      <div class="aciegas-headline" id="aciegas-headline"
        >estás agendando<br /><span class="aciegas-accent" id="aciegas-accent">a ciegas</span></div
      >
    </div>
    <img class="clip aciegas-sticker" id="aciegas-sticker" src="capture/assets/images/05-a-ciegas.png" alt="" data-start="0" data-duration="1.856" data-track-index="1" />
    <audio id="f05-voice" src="assets/voice/05.wav" data-start="0" data-duration="1.856" data-track-index="10" data-volume="1"></audio>
  </div>
  <script>
    window.__timelines = window.__timelines || {};
    var tl = gsap.timeline({ paused: true });

    // Scene 1 (0.0-1.856s): mismo fondo oscuro, continúa el crossfade desde el frame 4.
    // "estás agendando" entra por hard-cut casi instantáneo (línea fija, sub-forma A);
    // "a ciegas" (acento rosa fucsia) completa la frase en el mismo golpe, con un
    // asentamiento power3 corto (sin rebote) que le da el impacto del acento. Sostiene
    // hasta el corte de salida (no hay animación de salida: no es el frame final).

    tl.fromTo(
      "#aciegas-headline",
      { opacity: 0 },
      { opacity: 1, duration: 0.05, ease: "none" },
      0.0
    );

    tl.fromTo(
      "#aciegas-accent",
      { opacity: 0, scale: 1.14 },
      { opacity: 1, scale: 1, duration: 0.22, ease: "power3.out" },
      1.1
    );

    // Sticker (carita con antifaz) entra justo cuando "a ciegas" termina de
    // asentarse — ilustra el diagnostico, no lo adelanta.
    tl.fromTo(
      "#aciegas-sticker",
      { opacity: 0, scale: 0.7 },
      { opacity: 1, scale: 1, duration: 0.4, ease: "power3.out" },
      1.35
    );

    window.__timelines["05-a-ciegas"] = tl;
  </script>
    </template>
  </body>
</html>
