<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <style>
    body {
      margin: 0;
      font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      font-variant-numeric: tabular-nums;
      -webkit-font-smoothing: antialiased;
    }
    a { color: #FF1493; }
    a:hover { color: #c0266f; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; background: #FEF5FA; position: relative; overflow: hidden; display: flex; flex-direction: column;">

  <!-- Cabecera del panel -->
  <div style="background: #ffffff; padding: 16px 14px 14px; box-shadow: 0 1px 2px rgba(17,12,46,0.05), 0 2px 6px rgba(17,12,46,0.05);">
    <div style="display: flex; align-items: flex-start; justify-content: space-between; gap: 12px;">
      <div>
        <p style="margin: 0; font-size: 20px; font-weight: 700; color: #1f2937; letter-spacing: -0.014em;">Bella Mía</p>
        <p style="margin: 3px 0 0; font-size: 13px; color: #6b7280;">Panel del salón</p>
      </div>
      <div style="display: flex; gap: 8px; flex-shrink: 0;">
        <div style="width: 36px; height: 36px; border-radius: 9999px; background: #FEF5FA; border: 1px solid #FBC9E4; display: flex; align-items: center; justify-content: center;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FF1493" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg>
        </div>
        <div style="width: 36px; height: 36px; border-radius: 9999px; background: #FEF5FA; border: 1px solid #FBC9E4; display: flex; align-items: center; justify-content: center;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FF1493" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/></svg>
        </div>
      </div>
    </div>
  </div>

  <div style="padding: 14px; display: flex; flex-direction: column; gap: 12px; flex-grow: 1;">

    <!-- Frase del día -->
    <div style="background: linear-gradient(90deg, #FF1493, #f9a8d4); border-radius: 12px; padding: 14px 16px; display: flex; align-items: center; justify-content: space-between; gap: 12px; box-shadow: 0 1px 2px rgba(17,12,46,0.05), 0 2px 6px rgba(17,12,46,0.05);">
      <p style="margin: 0; font-size: 14px; font-weight: 500; font-style: italic; color: #ffffff; line-height: 1.4;">Cada clienta que vuelve es una que confió en ti.</p>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.75)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0;"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
    </div>

    <p style="margin: 6px 0 0; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; color: #9ca3af;">Turnos de hoy</p>

    <!-- Turnos -->
    <div style="display: flex; flex-direction: column; gap: 10px;">
      <div style="background: #ffffff; border-radius: 12px; border-left: 4px solid #FF1493; padding: 13px 14px; box-shadow: 0 1px 2px rgba(17,12,46,0.05), 0 2px 6px rgba(17,12,46,0.05); display: flex; align-items: center; justify-content: space-between; gap: 12px;">
        <div>
          <p style="margin: 0; font-size: 15px; font-weight: 600; color: #1f2937;">Yamila Corrales</p>
          <p style="margin: 3px 0 0; font-size: 13px; color: #6b7280;">Manicura semipermanente</p>
        </div>
        <span style="font-size: 15px; font-weight: 700; color: #FF1493; flex-shrink: 0;">09:00</span>
      </div>
      <div style="background: #ffffff; border-radius: 12px; border-left: 4px solid #FF1493; padding: 13px 14px; box-shadow: 0 1px 2px rgba(17,12,46,0.05), 0 2px 6px rgba(17,12,46,0.05); display: flex; align-items: center; justify-content: space-between; gap: 12px;">
        <div>
          <p style="margin: 0; font-size: 15px; font-weight: 600; color: #1f2937;">Dianelys Pérez</p>
          <p style="margin: 3px 0 0; font-size: 13px; color: #6b7280;">Uñas acrílicas + diseño</p>
        </div>
        <span style="font-size: 15px; font-weight: 700; color: #FF1493; flex-shrink: 0;">10:30</span>
      </div>
      <div style="background: #ffffff; border-radius: 12px; border-left: 4px solid #FBC9E4; padding: 13px 14px; box-shadow: 0 1px 2px rgba(17,12,46,0.05), 0 2px 6px rgba(17,12,46,0.05); display: flex; align-items: center; justify-content: space-between; gap: 12px;">
        <div>
          <p style="margin: 0; font-size: 15px; font-weight: 600; color: #1f2937;">Lisbet Ramos</p>
          <p style="margin: 3px 0 0; font-size: 13px; color: #6b7280;">Pedicura spa</p>
        </div>
        <span style="font-size: 15px; font-weight: 700; color: #9ca3af; flex-shrink: 0;">12:15</span>
      </div>
    </div>
  </div>

  <!-- Botón de soporte flotante: misma familia que los redondos de la
       cabecera, pero en blanco para que se despegue del fondo rosa claro. -->
  <div style="position: absolute; right: 16px; bottom: 20px; width: 52px; height: 52px; border-radius: 9999px; background: #ffffff; border: 1px solid #FBC9E4; box-shadow: 0 4px 8px rgba(17,12,46,0.04), 0 12px 28px rgba(17,12,46,0.10); display: flex; align-items: center; justify-content: center;">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#FF1493" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="m4.93 4.93 4.24 4.24"/><path d="m14.83 9.17 4.24-4.24"/><path d="m14.83 14.83 4.24 4.24"/><path d="m9.17 14.83-4.24 4.24"/><circle cx="12" cy="12" r="4"/></svg>
  </div>

</div>
</x-dc>
</body>
</html>
